package:
  name: scared
  version: {{ GIT_DESCRIBE_TAG }}

source:
  path: ../../

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python {{ python }}
    - setuptools>=64
    - setuptools-scm>=8
    - wheel
    - pip
    - numpy {{ numpy_version }}
  run:
    - python
    - numba
    - numpy>=2.0.0
    - estraces>=1.9.4
    - psutil
    - scipy
    # Note: scalib is optional, install separately if needed on x86_64
  run_constrained:
    # Wrong sdot/ddot results on arm64, fixed in 0.3.34: https://github.com/OpenMathLib/OpenBLAS/pull/5918
    - libopenblas !=0.3.32,!=0.3.33  # [aarch64 or arm64]

test:
  imports:
    - scared
  source_files:
    - tests
  requires:
    - pytest
    - pytest-cov
    - pytest-mock
    - pycryptodome
    # Note: tests requiring scalib will be skipped if not installed
  commands:
    - pytest

about:
  home: https://www.eshard.com/
  license: PROPRIETARY
  summary: 'scared Python library'
